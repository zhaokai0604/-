[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/platform.py" = ["F403"]
# These entrypoints deliberately add the repository backend directory to sys.path
# before importing the application, so their imports cannot be at the file top.
"backend/scripts/*.py" = ["E402"]
"backend/tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
