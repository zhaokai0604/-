# 简历评价智能体 — Nginx 生产配置示例
# 将 frontend/dist 放到 /var/www/resume-ai/dist
# 后端 Uvicorn 监听 127.0.0.1:8000

upstream resume_ai_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name resume.example.edu.cn;

    # 生产请配置 SSL 并 301 跳转 HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 120m;

    root /var/www/resume-ai/dist;
    index index.html;

    # SSE 实时分析流：关闭缓冲，延长读超时
    location ~ ^/api/history/[0-9]+/analysis-live$ {
        proxy_pass http://resume_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://resume_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

