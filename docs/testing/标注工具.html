<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>简析智评真实简历标注工具</title>
<style>
body{margin:0;background:#f3f6f8;color:#263443;font:14px "Microsoft YaHei",sans-serif}header{background:#17324d;color:white;padding:18px 24px}main{max-width:1200px;margin:18px auto;padding:0 16px}.bar,.box{background:white;border:1px solid #d8e1e8;border-radius:6px;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,label.file{padding:8px 12px;border:1px solid #b8c7d3;border-radius:4px;background:white;color:#17324d;cursor:pointer}button.primary{background:#176b87;color:white;border-color:#176b87}input[type=file]{display:none}.status{margin-left:auto;color:#647481}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.box h2{font-size:16px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid #e7edf1}#text{white-space:pre-wrap;line-height:1.65;min-height:600px;max-height:72vh;overflow:auto;background:#fbfcfd;border:1px solid #e2e9ee;padding:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 14px}.check{padding:8px;border:1px solid #e1e7ec;border-radius:4px}select,input[type=text],textarea{width:100%;padding:8px;border:1px solid #cbd6df;border-radius:4px;box-sizing:border-box;font:inherit}textarea{min-height:80px;resize:vertical}.field{display:block;margin:9px 0;color:#536371}.field input,.field select,.field textarea{display:block;margin-top:5px;color:#263443}.hint{font-size:12px;color:#6a7884;line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:1fr}#text{min-height:360px}.status{width:100%;margin-left:0}}
</style></head>
<body><header><b>简析智评 | 真实简历板块标注</b><div style="margin-top:5px;color:#c8d7e3;font-size:12px">只在本地浏览器处理脱敏 TXT，不上传文件。</div></header>
<main><div class="bar"><label class="file" for="files">导入脱敏 TXT</label><input id="files" type="file" multiple accept=".txt,.md"><button id="prev" disabled>上一份</button><button id="next" disabled>下一份</button><button id="save" class="primary" disabled>保存当前</button><button id="export" disabled>导出 UTF-8 JSON</button><span id="status" class="status">尚未导入</span></div>
<div class="grid"><section class="box"><h2 id="title">脱敏简历正文</h2><div id="text">请先导入本文件夹中的“数据集”目录里的 TXT。</div></section>
<section class="box"><h2>人工标注</h2><label class="field">标注者代号<input id="who" value="zhaowenkai" type="text"></label><div class="hint">勾选文本中确实有正文内容的板块；只有标题没有正文时不要勾选。</div><div id="sections" class="checks"></div><label class="field">解析质量<select id="quality"><option value="high">high：正文清楚</option><option value="medium" selected>medium：有碎片或噪声</option><option value="low">low：正文缺失较多</option></select></label><label class="field">简历内容质量<select id="rq"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><div class="hint">问题类型可多选，只描述实际问题，不是给系统打分。</div><div id="issues" class="checks"></div><label class="field">备注<textarea id="notes" placeholder="例如：标题缺失，但正文明确描述实习内容。"></textarea></label><button id="clear">清空当前标签</button></section></div></main>
<script>
const sectionDefs=[['basic_info','基本信息'],['education','教育经历'],['internship','实习/工作'],['projects','项目经历'],['campus','校园经历'],['skills','技能证书'],['awards','获奖荣誉'],['summary','自我评价']];
const issueDefs=[['layout_fragmentation','版式碎片化'],['ocr_noise','OCR噪声'],['missing_metrics','缺少量化指标'],['weak_structure','结构不清'],['missing_internship','缺少实习'],['missing_projects','缺少项目'],['over_scored_risk','虚高风险']];
const S={files:[],i:-1,rows:new Map()},$=x=>document.getElementById(x);$('who').value='';$('who').placeholder='请先填写你的代号';
function caseId(name,index){let stem=(name||'').replace(/\.[^.]+$/,'');return stem||`resume-${String(index+1).padStart(3,'0')}`}
function checks(id,defs,group){$(id).innerHTML=defs.map(x=>`<div class="check"><label><input type="checkbox" data-g="${group}" value="${x[0]}"> ${x[1]}</label></div>`).join('')}
checks('sections',sectionDefs,'s');checks('issues',issueDefs,'i');
function vals(g){return [...document.querySelectorAll(`[data-g="${g}"]:checked`)].map(x=>x.value)}function setv(g,a){document.querySelectorAll(`[data-g="${g}"]`).forEach(x=>x.checked=a.includes(x.value))}
function row(){let name=S.files[S.i].name;return S.rows.get(name)||{id:caseId(name,S.i),gold_sections:[],issue_types:[],parse_quality:'medium',resume_quality:3,notes:''}}
function read(){let r=row();return {...r,annotator_a:$('who').value.trim(),source_type:S.files[S.i].name.split('.').pop(),gold_sections:vals('s'),issue_types:vals('i'),parse_quality:$('quality').value,resume_quality:Number($('rq').value),notes:$('notes').value.trim(),label_status:'initial'}}
function write(r){setv('s',r.gold_sections||[]);setv('i',r.issue_types||[]);$('quality').value=r.parse_quality||'medium';$('rq').value=r.resume_quality||3;$('notes').value=r.notes||''}
function refresh(){let ok=S.i>=0;$('prev').disabled=!ok||S.i===0;$('next').disabled=!ok||S.i===S.files.length-1;$('save').disabled=!ok;$('export').disabled=!S.files.length;if(!ok)return;let f=S.files[S.i];$('title').textContent=`${S.i+1}/${S.files.length} | ${f.name}`;$('text').textContent=f.text;write(row());$('status').textContent=`已保存 ${S.rows.size}/${S.files.length}`}
function save(){if(S.i>=0)S.rows.set(S.files[S.i].name,read());refresh()}
$('files').onchange=async e=>{S.files=[];S.rows.clear();for(let f of e.target.files)S.files.push({name:f.name,text:await f.text()});S.i=S.files.length?0:-1;refresh()};$('prev').onclick=()=>{save();S.i--;refresh()};$('next').onclick=()=>{save();S.i++;refresh()};$('save').onclick=save;
$('clear').onclick=()=>{setv('s',[]);setv('i',[]);$('quality').value='medium';$('rq').value=3;$('notes').value=''};
$('export').onclick=()=>{save();let cases=S.files.map((f,n)=>({...S.rows.get(f.name),text:f.text,id:S.rows.get(f.name)?.id||caseId(f.name,n),source_file:f.name}));let p={version:1,label_policy:'independent_two_annotator_annotation',cases};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json;charset=utf-8'}));a.download='real_parse_annotations.json';a.click();URL.revokeObjectURL(a.href)};refresh();
</script></body></html>
