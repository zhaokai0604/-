name: Bug report
description: Report a reproducible defect without personal data or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real resumes, database files, API keys, cookies, or screenshots containing personal data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: "e.g. main at abc1234"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove names, contact details, tokens, paths, and document content.
